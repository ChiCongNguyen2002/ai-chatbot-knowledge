[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log

[program:ollama]
command=/usr/local/bin/ollama serve
autostart=true
autorestart=true
stderr_logfile=/tmp/ollama_err.log
stdout_logfile=/tmp/ollama_out.log
environment=OLLAMA_HOST=0.0.0.0:11434

[program:fastapi]
command=python /app/app_simple.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/tmp/fastapi_err.log
stdout_logfile=/tmp/fastapi_out.log
environment=PORT=8000,OLLAMA_HOST=http://localhost:11434,PYTHONUNBUFFERED=1
